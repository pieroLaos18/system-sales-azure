name: Build and deploy Node.js app to Azure Web App - system-sales-backend

on:
  push:
    branches:
      - azure-deploy
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install and build
        working-directory: backend
        run: |
          npm install
          npm run build --if-present

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: 8f4e13c5-cb84-474f-8443-8ed0f67ea57f
          tenant-id: 13841d5f-968d-4624-a7da-d68a6006a84a
          subscription-id: cc49c9b9-70e4-4ee9-870a-946f222e9651

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: system-sales-backend
          slot-name: Production
          package: ./backend
